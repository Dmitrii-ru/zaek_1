<!DOCTYPE html>
{% load static %}

{% block extrahead %}
<script>window.CKEDITOR_BASEPATH = '/static/ckeditor/ckeditor/';</script>
{{ block.super }}

{% endblock %}


<html lang="en">
<head>
  <link rel="stylesheet" href="{% static 'todo/css/base.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script type="text/javascript" src="{% static 'ckeditor/ckeditor-init.js' %}"></script>
  <script type="text/javascript" src="{% static 'ckeditor/ckeditor/ckeditor.js' %}"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,200;1,200&display=swap" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <meta charset="UTF-8">
  <title>
        {% block title %} Мое резюме {% endblock %}
  </title>
</head>
  <body class="text_foll">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'zaek_app:index' %}">
                <i class="bi bi-trophy-fill"></i> Zaek
            </a>
            <a class="navbar-brand" href="{% url 'zaek_app:zaek-decoded' %}">
                <i class="bi bi-trophy-fill"></i> decoded
            </a>

            <a class="navbar-brand" href="{% url 'todo_session_app:todo_session' %}">
                <i class="bi bi-trophy-fill"></i> TODO
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'zaek_app:profile' %}">
                            <i class="bi bi-person-circle"></i> {{ user.username }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="">
                            <i class="bi bi-box-arrow-right"></i> Выйти
                        </a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="">
                            <i class="bi bi-box-arrow-in-right"></i> Войти
                        </a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>



      <header class="m-1 mb-3">
        <div class="d-flex justify-content-center decorat">

        </div>
      </header>

      <main>
        {%block context%}

        {%endblock%}
      </main>
      <footer>
          <p>©Все правы</p>
      </footer>
  </body>
</html>
